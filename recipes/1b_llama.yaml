schema_version: 1
name: 1b-llama

execution:
  submission_script: ../submission/train_1b_llama.sh
  project_name: mask_pretraining
  experiment_name: "{study}__{condition}"
  checkpoint_root: "/capstor/scratch/cscs/smehra/megatron-runs/checkpoints/{project}/{experiment}"
  artifacts_root: ../runs
  sbatch_args:
    - --account=infra01
    # One allocation may not finish the 36B-token trunk; rolling checkpoints
    # make it safe to resume while staying within the site wall-time limit.
    - --time=12:00:00
    - --nodes=4
    - --ntasks-per-node=1
    - --gpus-per-node=4
    - --cpus-per-task=72
    - --mem=460000
    - --no-requeue

# These are the invariant settings for every condition using this recipe.
# Conditions may override only keys declared in this mapping.
environment:
  DATASETS: /iopsstor/scratch/cscs/smehra/tokenized_datasets/dclm-edu__mistral-7b-v0.3
  TOKENIZER_MODEL: mistralai/Mistral-7B-v0.3
  MEGATRON_LM_DIR: /users/smehra/developer/Megatron-LM
  DATASET_CACHE_DIR: "${SCRATCH}/datasets/cache-dclm-edu-mistral-v03"
  CHECKPOINT_STORAGE_ROOT: /capstor/scratch/cscs/smehra/megatron-runs
  WANDB_PROJECT: mask_pretraining
  MBS: 8
  # MEAP Table 11 specifies a global batch of 256 sequences.
  GBS: 256
  SEQ_LEN: 4096
  # Frozen approximately 1.15B member of the model family.
  NUM_LAYERS: 24
  HIDDEN_SIZE: 2048
  FFN_HIDDEN_SIZE: 5632
  NUM_ATTENTION_HEADS: 32
  NUM_QUERY_GROUPS: 8
  INIT_METHOD_STD: 0.013975424859373685
  # Use the modern Llama 3 base frequency from initial pretraining to ease
  # later long-context extension without enabling post-hoc RoPE scaling.
  ROTARY_BASE: 500000
  # Reach the peak early enough that shorter-budget conditions spend most of
  # training in WSD's stable phase. Cooldown branches do not restart warmup.
  WARMUP_STEPS: 1000
  # Selected from the 1.1B Muon pilot sweep: this setting had the lowest
  # validation loss across nearly the entire run while remaining stable.
  PEAK_LR: 0.0008
  MIN_LR: 0.00008
  # The released MEAP pretraining scripts seed model/data setup with 3407.
  SEED: 3407
  LOG_INTERVAL: 1
  EVAL_INTERVAL: 100
  EVAL_ITERS: 10
  DISTRIBUTED_TIMEOUT_MINUTES: 60
  ATTENTION_DROPOUT: 0.0
  HIDDEN_DROPOUT: 0.0
  WEIGHT_DECAY: 0.05
  OPTIMIZER: muon
  MUON_MOMENTUM: 0.95
  MUON_NESTEROV: true
  MUON_SCALE_MODE: spectral
  MUON_EXTRA_SCALE_FACTOR: 0.2
  MUON_NUM_NS_STEPS: 5
  MUON_SCALAR_OPTIMIZER: adam
  MTP_NUM_LAYERS: 0
  # TODO(mtp-calibration): 0.1 is Megatron's upstream default; freeze or tune
  # this auxiliary-loss weight before confirmatory runs.
  MTP_LOSS_SCALING_FACTOR: 0.1
  SAVE_EVERY_TOKENS: 10000000000
  ROLLING_CHECKPOINTS: true
  ROLLING_SAVE_EVERY_TOKENS: 1000000000
  COOLDOWN_STYLE: minus_sqrt
  INPUT_MASK_RATIO: 0.0
  INPUT_MASK_STRATEGY: random
  INPUT_MASK_SPAN_LENGTH: 1
  INPUT_MASK_TOKEN: "[control_768]"
  INPUT_MASK_DEBUG: false
  INPUT_MASK_DEBUG_TOKENS: 128
  LOG_NCCL: false
  NSYS_PROFILER: false
  MOCK_DATA: false
  BACKUP_CODEBASE: false
  RUN_CAPSTOR_DIAGNOSTICS: false

stages:
  main:
    # 36B stable-trunk tokens plus a 4B cooldown gives a 40B-token run.
    train_tokens: 36000000000
  cooldown:
    branches:
      - source_iteration: 34333
        tokens: 4000000000
