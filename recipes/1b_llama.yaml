schema_version: 1
name: 1b-llama

execution:
  submission_script: ../submission/train_1b_llama.sh
  project_name: mask_pretraining
  experiment_name: "{study}__{condition}"
  checkpoint_root: "/capstor/scratch/cscs/smehra/megatron-runs/checkpoints/{project}/{experiment}"
  artifacts_root: ../runs
  sbatch_args:
    - --account=infra01
    - --time=02:00:00
    - --nodes=1
    - --ntasks-per-node=1
    - --gpus-per-node=4
    - --cpus-per-task=72
    - --mem=460000
    - --no-requeue

# These are the invariant settings for every condition using this recipe.
# Conditions may override only keys declared in this mapping.
environment:
  DATASETS: /iopsstor/scratch/cscs/smehra/tokenized_datasets/dclm-edu__mistral-7b-v0.3
  TOKENIZER_MODEL: mistralai/Mistral-7B-v0.3
  MEGATRON_LM_DIR: /users/smehra/developer/Megatron-LM
  DATASET_CACHE_DIR: "${SCRATCH}/datasets/cache-dclm-edu-mistral-v03"
  CHECKPOINT_STORAGE_ROOT: /capstor/scratch/cscs/smehra/megatron-runs
  MBS: 4
  # MEAP Table 11 specifies a global batch of 256 sequences.
  GBS: 256
  SEQ_LEN: 4096
  # Use the modern Llama 3 base frequency from initial pretraining to ease
  # later long-context extension without enabling post-hoc RoPE scaling.
  ROTARY_BASE: 500000
  # Approximately 10% of the paper's 190K-step, 200B-token run. Under WSD,
  # this warmup is shared by the main trunk rather than restarted per budget.
  WARMUP_STEPS: 19000
  PEAK_LR: 0.0004
  MIN_LR: 0.00004
  # The released MEAP pretraining scripts seed model/data setup with 3407.
  SEED: 3407
  LOG_INTERVAL: 1
  EVAL_INTERVAL: 100
  EVAL_ITERS: 10
  ATTENTION_DROPOUT: 0.0
  HIDDEN_DROPOUT: 0.0
  WEIGHT_DECAY: 0.05
  SAVE_EVERY_TOKENS: 10000000000
  ROLLING_CHECKPOINTS: true
  ROLLING_SAVE_EVERY_TOKENS: 1000000000
  COOLDOWN_STYLE: minus_sqrt
  INPUT_MASK_RATIO: 0.0
  INPUT_MASK_STRATEGY: random
  INPUT_MASK_SPAN_LENGTH: 1
  INPUT_MASK_TOKEN: "[control_768]"
  INPUT_MASK_DEBUG: false
  INPUT_MASK_DEBUG_TOKENS: 128
  LOG_NCCL: false
  NSYS_PROFILER: false
  MOCK_DATA: false
  BACKUP_CODEBASE: false
  RUN_CAPSTOR_DIAGNOSTICS: false

stages:
  main:
    train_tokens: 200000000000
  cooldown:
    # Preserve the existing 10B-token WSD cooldown assumption. With a batch of
    # 256, persistent saves are 9,537 iterations apart (~10B tokens), so these
    # branches finish close to the paper's 40B, 60B, and 200B budgets.
    branches:
      - source_iteration: 28611
        tokens: 10000000000
      - source_iteration: 47685
        tokens: 10000000000
      - source_iteration: 181203
        tokens: 10000000000
