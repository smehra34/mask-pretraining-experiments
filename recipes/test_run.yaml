schema_version: 1
name: test-run

execution:
  # Exercise the production launcher directly so the smoke test cannot drift
  # to a different architecture or runtime configuration.
  submission_script: ../submission/train_1b_llama.sh
  project_name: mask_pretraining_test
  experiment_name: "mistral-v03-{condition}"
  checkpoint_root: "/capstor/scratch/cscs/smehra/megatron-runs/checkpoints/{project}/{experiment}"
  artifacts_root: ../runs
  sbatch_args:
    - --account=infra01
    - --time=00:45:00
    - --nodes=1
    - --ntasks-per-node=1
    - --gpus-per-node=4
    - --cpus-per-task=72
    - --mem=460000
    - --no-requeue

# Same model and topology as 1b_llama; only the experimental schedule is small.
environment:
  DATASETS: /iopsstor/scratch/cscs/smehra/tokenized_datasets/dclm-edu__mistral-7b-v0.3
  TOKENIZER_MODEL: mistralai/Mistral-7B-v0.3
  MEGATRON_LM_DIR: /users/smehra/developer/Megatron-LM
  DATASET_CACHE_DIR: "${SCRATCH}/datasets/cache-dclm-edu-mistral-v03-test"
  CHECKPOINT_STORAGE_ROOT: /capstor/scratch/cscs/smehra/megatron-runs
  MBS: 4
  GBS: 1024
  SEQ_LEN: 4096
  WARMUP_STEPS: 2
  PEAK_LR: 0.00001
  MIN_LR: 0.0
  SEED: 28
  LOG_INTERVAL: 1
  EVAL_INTERVAL: 100
  EVAL_ITERS: 10
  ATTENTION_DROPOUT: 0.0
  HIDDEN_DROPOUT: 0.0
  WEIGHT_DECAY: 0.1
  # Save persistently at the end and make one rolling recovery checkpoint at
  # iteration 12. A 1B distributed optimizer checkpoint is roughly 15 GB, so
  # checkpointing every few smoke iterations overwhelms the test.
  SAVE_EVERY_TOKENS: 100000000
  ROLLING_CHECKPOINTS: true
  ROLLING_SAVE_EVERY_TOKENS: 50000000
  COOLDOWN_STYLE: minus_sqrt
  INPUT_MASK_RATIO: 0.0
  INPUT_MASK_STRATEGY: random
  INPUT_MASK_SPAN_LENGTH: 1
  INPUT_MASK_TOKEN: "[control_768]"
  INPUT_MASK_DEBUG: false
  INPUT_MASK_DEBUG_TOKENS: 64
  LOG_NCCL: false
  NSYS_PROFILER: false
  MOCK_DATA: false
  BACKUP_CODEBASE: false
  RUN_CAPSTOR_DIAGNOSTICS: false

stages:
  main:
    train_tokens: 100000000
  cooldown:
    branches:
      - source_iteration: 24
        tokens: 10000000
