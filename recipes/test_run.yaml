schema_version: 1
name: test-run

execution:
  submission_script: ../submission/train_1b_llama_test.sh
  project_name: mask_pretraining_test
  experiment_name: "{condition}"
  checkpoint_root: "${SCRATCH}/megatron-runs/checkpoints/{project}/{experiment}"
  artifacts_root: ../runs
  sbatch_args:
    - --account=infra01
    - --time=00:30:00
    - --nodes=1
    - --ntasks-per-node=1
    - --gpus-per-node=4
    - --cpus-per-task=72
    - --mem=460000
    - --no-requeue

# Same model and topology as 1b_llama; only the experimental schedule is small.
environment:
  DATASETS: /capstor/store/cscs/swissai/infra01/datasets/tokenized/swissai-dclm-edu-filterrobots_fine-merge/
  MEGATRON_LM_DIR: "${SCRATCH}/Megatron-LM"
  DATASET_CACHE_DIR: "${SCRATCH}/datasets/cache"
  MBS: 4
  GBS: 1024
  SEQ_LEN: 4096
  WARMUP_STEPS: 2
  PEAK_LR: 0.00001
  MIN_LR: 0.0
  SEED: 28
  LOG_INTERVAL: 1
  EVAL_INTERVAL: 100
  EVAL_ITERS: 10
  ATTENTION_DROPOUT: 0.0
  HIDDEN_DROPOUT: 0.0
  WEIGHT_DECAY: 0.1
  SAVE_EVERY_TOKENS: 25000000
  ROLLING_CHECKPOINTS: true
  ROLLING_SAVE_EVERY_TOKENS: 8000000
  COOLDOWN_STYLE: minus_sqrt
  INPUT_MASK_RATIO: 0.0
  INPUT_MASK_STRATEGY: random
  INPUT_MASK_SPAN_LENGTH: 1
  INPUT_MASK_TOKEN: <SPECIAL_999>
  INPUT_MASK_DEBUG: false
  INPUT_MASK_DEBUG_TOKENS: 64
  LOG_NCCL: false
  NSYS_PROFILER: false
  MOCK_DATA: false
  BACKUP_CODEBASE: false
  RUN_CAPSTOR_DIAGNOSTICS: false

stages:
  main:
    train_tokens: 100000000
  cooldown:
    branches:
      - source_iteration: 6
        tokens: 20000000
      - source_iteration: 18
        tokens: 10000000

