schema_version: 1

backend:
  megatron_path: /users/smehra/developer/Megatron-LM
  lm_eval_source: /users/smehra/developer/lm-eval-v0.4.12
  output_root: /capstor/scratch/cscs/smehra/megatron-runs/evaluations
  account: infra01
  partition: preemptable
  nodes: 1
  gpus_per_node: 1
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 1
  run_time: 00:05:00
  container_edf: test-env
  timing_warmups: 3
  timing_repetitions: 10

suites:
  speculative-tiny:
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/natural-continuations-tiny.jsonl
    draft_depths: [1, 2, 3]
    drafters_by_objective: &condition_drafters
      ntp: [ar, mask]
      masked: [ar, mask]
      mtp: [ar, mtp]
    max_new_tokens: 8
    batch_sizes: [1]
    seeds: [1234]
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  # Mask-only cached-generation smoke for checkpoints whose tokenizer/training
  # metadata exposes the configured mask token.
  speculative-tiny-cached-mask:
    analysis_mode: cached_generation
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/natural-continuations-tiny.jsonl
    draft_depths: [1, 2, 3]
    drafters: [ar, mask]
    max_new_tokens: 8
    batch_sizes: [1]
    seeds: [1234]
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  # Compatibility suite name for the unified cached batch benchmark.
  speculative-tiny-cache-benchmark:
    analysis_mode: batch_timing_benchmark
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/speculative-natural-v1/dclm-edu-validation.jsonl
    # Two frozen 256-token prompts are enough for a systems smoke while making
    # the avoided full-prefix work visible. This is not an acceptance suite.
    timing_max_prompts: 2
    draft_depths: [1, 3]
    drafters: [ar, mask]
    max_new_tokens: 16
    batch_sizes: [1, 2]
    seeds: [1234]
    timing_profiles: [greedy]
    timing_warmups: 1
    timing_repetitions: 3
    backend_overrides:
      run_time: 00:15:00
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  # Unified cached AR/speculative timing as physical batch size changes.
  speculative-tiny-batch-benchmark:
    analysis_mode: batch_timing_benchmark
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/speculative-natural-v1/dclm-edu-validation.jsonl
    timing_max_prompts: 2
    draft_depths: [1, 3]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 16
    batch_sizes: [1, 2]
    seeds: [1234]
    timing_profiles: [greedy]
    timing_warmups: 1
    timing_repetitions: 3
    backend_overrides:
      run_time: 00:10:00
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  # Paired correctness and systems benchmark for the compacting static cache
  # and the paged dynamic cache. Run both suite variants on the same checkpoint,
  # then compare their aggregates with tools/compare_speculative_cache_benchmarks.py.
  # Eight prompts make every requested physical batch size exact (no short tail).
  speculative-cache-compare-dynamic: &cache_compare
    analysis_mode: batch_timing_benchmark
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/speculative-natural-v1/dclm-edu-validation.jsonl
    timing_max_prompts: 8
    draft_depths: [1, 3]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 32
    batch_sizes: [1, 2, 4, 8]
    seeds: [1234]
    timing_profiles: [greedy, temperature_1]
    timing_warmups: 2
    timing_repetitions: 5
    cache_backend: dynamic
    backend_overrides:
      run_time: 00:30:00
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  speculative-cache-compare-static:
    <<: *cache_compare
    cache_backend: static

  speculative-tiny-batched:
    analysis_mode: cached_generation
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/natural-continuations-tiny.jsonl
    draft_depths: [1, 2, 3]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 8
    batch_sizes: [4]
    seeds: [1234]
    backend_overrides:
      run_time: 00:10:00
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  speculative-tiny-potential:
    analysis_mode: draft_potential
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/natural-continuations-tiny.jsonl
    draft_depths: [1, 2, 3]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 1
    batch_sizes: [4]
    seeds: [1234]
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  speculative-smoke:
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/natural-continuations-smoke.jsonl
    draft_depths: [1, 2, 3, 4, 6, 8]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 32
    batch_sizes: [1]
    seeds: [1234]
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  speculative-1p1b-final:
    analysis_mode: cached_generation
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/natural-continuations-smoke.jsonl
    draft_depths: [1, 2, 3, 4, 6, 8]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 128
    batch_sizes: [1]
    seeds: [1234]
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  speculative-natural-v1:
    analysis_mode: cached_generation
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/speculative-natural-v1/all.jsonl
    draft_depths: [1, 2, 3, 4, 6, 8]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 128
    batch_sizes: [1]
    seeds: [1234]
    backend_overrides:
      # Conservative legacy allocation; the cached path normally completes sooner.
      run_time: 06:00:00
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  # High-throughput acceptance study. Each equal-length prompt batch executes
  # only the maximum requested depth and derives the shallower fixed-prefix
  # observations by exact tensor slicing. This is not a generation benchmark.
  speculative-natural-v1-potential:
    analysis_mode: draft_potential
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/speculative-natural-v1/all.jsonl
    draft_depths: [1, 2, 3, 4, 6, 8]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 1
    batch_sizes: [8]
    seeds: [1234]
    backend_overrides:
      run_time: 01:00:00
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  # Complete, independent continuations with dynamic regrouping by exact
  # causal length. Unlike draft_potential, every depth retains its own path.
  speculative-natural-v1-batched:
    analysis_mode: cached_generation
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/speculative-natural-v1/all.jsonl
    draft_depths: [1, 2, 3, 4, 6, 8]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 128
    batch_sizes: [8]
    seeds: [1234]
    backend_overrides:
      run_time: 02:00:00
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

  speculative-dclm-pilot:
    workload: /users/smehra/developer/mask-experiment-manager/evaluations/workloads/speculative-natural-v1/dclm-edu-validation.jsonl
    draft_depths: [1, 2, 3]
    drafters_by_objective: *condition_drafters
    max_new_tokens: 8
    batch_sizes: [1]
    seeds: [1234]
    backend_overrides:
      run_time: 01:00:00
    sampling_profiles:
      greedy: {temperature: 0, top_k: 0, top_p: 1.0}
      temperature_1: {temperature: 1.0, top_k: 0, top_p: 1.0}

# Resolve each run/stage separately so every speculative condition is paired
# with its own checkpoint's AR baseline. These selectors are labels; immutable
# run-directory paths are supplied to plan/render commands.
initial_matrix:
  - {seed: 3407, objective: ntp, conditions: [ar, mask]}
  - {seed: 3407, objective: mtp, conditions: [ar_mtp_disabled, recursive_mtp]}
  - {seed: 3407, objective: variable_span, conditions: [ar, mask]}
  - {seed: 67, objective: ntp, conditions: [ar, mask]}
  - {seed: 67, objective: mtp, conditions: [ar_mtp_disabled, recursive_mtp]}
  - {seed: 67, objective: variable_span, conditions: [ar, mask]}
